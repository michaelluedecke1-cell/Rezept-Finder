<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zutaten-Koch</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#42A5F5">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .settings-link { text-decoration: none; font-size: 28px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button, textarea { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        button { background: #42A5F5; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #1E88E5; }
        
        .button-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-wakelock { background: #FF9800; flex: 1; min-width: 120px; }
        .btn-wakelock:hover { background: #F57C00; }
        .btn-wakelock.active { background: #4CAF50; }
        .btn-wakelock.active:hover { background: #388E3C; }
        
        #recipeResult, .markdown-body { line-height: 1.6; }
        #recipeResult h1, #recipeResult h2, #recipeResult h3,
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 0; color: #333; }
        #recipeResult ul, #recipeResult ol,
        .markdown-body ul, .markdown-body ol { padding-left: 20px; }
        
        /* NEU: CSS für die schicke Lade-Animation */
        .loader-container { text-align: center; padding: 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #42A5F5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Was kochen wir? 🍳</h1>
        <a href="settings.html" class="settings-link" title="Einstellungen">⚙️</a>
    </div>

    <div class="card">
        <label for="ingredients">Welche Zutaten hast du da?</label>
        <textarea id="ingredients" rows="3" placeholder="z.B. Nudeln, passierte Tomaten, Zwiebeln, Käse..."></textarea>
        
        <div class="button-group">
            <button id="searchRecipe" style="flex: 2; min-width: 150px;">Rezept finden</button>
            <button id="wakeLockBtn" class="btn-wakelock" title="Display anlassen">💡 Display an</button>
        </div>
    </div>

    <div id="loading" class="hidden loader-container card">
        <div class="spinner"></div>
        <strong>Rezept wird geköchelt... 🧑‍🍳</strong>
    </div>

    <div class="card hidden" id="resultCard">
        <div id="recipeResult"></div>
        
        <div class="button-group" style="margin-top: 20px;">
            <button id="saveRecipeBtn" style="background: #2196F3; flex: 1;">💾 Speichern</button>
            <button id="shareRecipeBtn" style="background: #9C27B0; flex: 1;">📤 Teilen</button>
            <button id="printRecipeBtn" style="background: #607D8B; flex: 1;">🖨️ Drucken</button>
        </div>
    </div>

    <div class="card">
        <h2>Meine gespeicherten Rezepte 📚</h2>
        <div id="savedRecipesList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
